name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libdbus-1-dev libxdo-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Rename binary (Linux)
        if: runner.os == 'Linux'
        run: mv target/release/juicebox-plus target/release/juicebox-plus-linux

      - name: Bundle libxdo for portability (Linux)
        if: runner.os == 'Linux'
        run: |
          LIBXDO=$(ldd target/release/juicebox-plus-linux | awk '/libxdo\.so/{print $3; exit}')
          cp "$LIBXDO" target/release/
          patchelf --set-rpath '$ORIGIN' target/release/juicebox-plus-linux
          cd target/release
          tar -czf juicebox-plus-linux.tar.gz juicebox-plus-linux "$(basename "$LIBXDO")"
          sha256sum juicebox-plus-linux.tar.gz > juicebox-plus-linux.tar.gz.sha256

      - name: Rename binary (macOS)
        if: runner.os == 'macOS'
        run: mv target/release/juicebox-plus target/release/juicebox-plus-macos

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: mv target/release/juicebox-plus.exe target/release/juicebox-plus-windows.exe

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: juicebox-plus-linux
          path: target/release/juicebox-plus-linux.tar.gz*

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: juicebox-plus-macos
          path: target/release/juicebox-plus-macos

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: juicebox-plus-${{ matrix.os }}
          path: target/release/juicebox-plus-windows.exe

  package-windows:
    needs: build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: juicebox-plus-windows-latest
          path: staging

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Create installer
        shell: pwsh
        run: |
          Copy-Item staging\juicebox-plus-windows.exe packaging\windows\juicebox-plus.exe
          $version = "${{ github.ref_name }}"
          $version = $version -replace '^v', ''
          iscc /dAppVersion=$version packaging\windows\setup.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: juicebox-plus-windows-setup
          path: packaging/windows/juicebox-plus-setup-*.exe

  release:
    needs: [build, package-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
