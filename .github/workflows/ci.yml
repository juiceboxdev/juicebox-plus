name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libdbus-1-dev libxdo-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: juicebox-plus-${{ matrix.os }}
          path: target/release/juicebox-plus

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: juicebox-plus-${{ matrix.os }}
          path: target/release/juicebox-plus.exe

  package-windows:
    if: github.event_name == 'push'
    needs: build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: juicebox-plus-windows-latest
          path: staging

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Create installer
        shell: pwsh
        run: |
          Copy-Item staging\juicebox-plus.exe packaging\windows\
          $version = (Get-Item staging\juicebox-plus.exe).VersionInfo.ProductVersion
          if (-not $version) { $version = "1.0.0" }
          iscc /dAppVersion=$version packaging\windows\setup.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: juicebox-plus-windows-setup
          path: packaging/windows/juicebox-plus-setup-*.exe

  continuous-release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: juicebox-plus-ubuntu-latest
          path: staging

      - name: Rename binary
        run: cp staging/juicebox-plus staging/juicebox-plus-linux

      - name: Upload to continuous release
        uses: ncipollo/release-action@v1
        with:
          tag: continuous
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          replacesArtifacts: true
          artifacts: staging/juicebox-plus-linux
