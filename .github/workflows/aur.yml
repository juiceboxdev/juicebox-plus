name: AUR

on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  deploy-git:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write SSH key
        run: |
          mkdir -p /dev/shm
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > /dev/shm/aur-key
          chmod 600 /dev/shm/aur-key

      - name: Publish juicebox2-plus-git to AUR
        run: |
          cd /tmp
          rm -rf aur-push && mkdir aur-push && cd aur-push

          cp "$GITHUB_WORKSPACE/packaging/linux/arch/PKGBUILD" .
          source PKGBUILD

          {
            echo "pkgbase = $pkgname"
            echo "  pkgdesc = $pkgdesc"
            echo "  pkgver = $pkgver"
            echo "  pkgrel = $pkgrel"
            echo "  url = $url"
            for a in "${arch[@]}"; do echo "  arch = $a"; done
            echo "  license = $license"
            for d in "${depends[@]}"; do echo "  depends = $d"; done
            for d in "${makedepends[@]}"; do echo "  makedepends = $d"; done
            echo "  provides = $provides"
            echo "  conflicts = $conflicts"
            for s in "${source[@]}"; do echo "  source = $s"; done
            for m in "${md5sums[@]}"; do echo "  md5sums = $m"; done
            echo "pkgname = $pkgname"
          } > .SRCINFO

          git init
          git config user.name "JuiceyDev"
          git config user.email "me@juicey.dev"
          git add -A
          git commit -m "aur update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add aur ssh://aur@aur.archlinux.org/juicebox2-plus-git.git
          GIT_SSH_COMMAND="ssh -i /dev/shm/aur-key -o StrictHostKeyChecking=accept-new" git fetch aur master 2>/dev/null || true
          if [ -f .git/FETCH_HEAD ]; then
            git reset --soft FETCH_HEAD
          fi
          git add -A
          git commit --allow-empty -m "aur update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          GIT_SSH_COMMAND="ssh -i /dev/shm/aur-key -o StrictHostKeyChecking=accept-new" git push aur master

  deploy-bin:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write SSH key
        run: |
          mkdir -p /dev/shm
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > /dev/shm/aur-key
          chmod 600 /dev/shm/aur-key

      - name: Publish juicebox2-plus-bin to AUR
        run: |
          version="${GITHUB_REF_NAME#v}"

          cd /tmp
          rm -rf aur-push && mkdir aur-push && cd aur-push

          cp "$GITHUB_WORKSPACE/packaging/linux/arch/PKGBUILD.bin" PKGBUILD
          sed -i "s/^pkgver=0\\.0\\.0/pkgver=$version/" PKGBUILD
          source PKGBUILD

          {
            echo "pkgbase = $pkgname"
            echo "  pkgdesc = $pkgdesc"
            echo "  pkgver = $pkgver"
            echo "  pkgrel = $pkgrel"
            echo "  url = $url"
            for a in "${arch[@]}"; do echo "  arch = $a"; done
            echo "  license = $license"
            for d in "${depends[@]}"; do echo "  depends = $d"; done
            echo "  provides = $provides"
            echo "  conflicts = $conflicts"
            for s in "${source[@]}"; do echo "  source = $s"; done
            for m in "${md5sums[@]}"; do echo "  md5sums = $m"; done
            echo "pkgname = $pkgname"
          } > .SRCINFO

          git init
          git config user.name "JuiceyDev"
          git config user.email "me@juicey.dev"
          git add -A
          git commit -m "aur update v$version ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git remote add aur ssh://aur@aur.archlinux.org/juicebox2-plus-bin.git
          GIT_SSH_COMMAND="ssh -i /dev/shm/aur-key -o StrictHostKeyChecking=accept-new" git fetch aur master 2>/dev/null || true
          if [ -f .git/FETCH_HEAD ]; then
            git reset --soft FETCH_HEAD
          fi
          git add -A
          git commit --allow-empty -m "aur update v$version ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          GIT_SSH_COMMAND="ssh -i /dev/shm/aur-key -o StrictHostKeyChecking=accept-new" git push aur master
