name: AUR

on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  deploy-git:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write SSH key
        run: |
          mkdir -p /dev/shm
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > /dev/shm/aur-key
          chmod 600 /dev/shm/aur-key

      - name: Publish juicebox2-plus-git to AUR
        run: |
          cd /tmp
          rm -rf aur-push && mkdir aur-push && cd aur-push

          cp "$GITHUB_WORKSPACE/packaging/linux/arch/PKGBUILD" .

          echo 'pkgbase = juicebox2-plus-git' > .SRCINFO
          echo '  pkgdesc = The companion app for juicebox!' >> .SRCINFO
          echo '  pkgver = r0.0000000' >> .SRCINFO
          echo '  pkgrel = 1' >> .SRCINFO
          echo '  url = https://github.com/juiceboxdev/juicebox-plus' >> .SRCINFO
          echo '  arch = x86_64' >> .SRCINFO
          echo '  license = LGPL-3.0-or-later' >> .SRCINFO
          echo '  makedepends = git' >> .SRCINFO
          echo '  makedepends = cargo' >> .SRCINFO
          echo '  depends = gtk3' >> .SRCINFO
          echo '  depends = libappindicator-gtk3' >> .SRCINFO
          echo '  depends = libdbus' >> .SRCINFO
          echo '  depends = libxdo' >> .SRCINFO
          echo '  depends = glibc' >> .SRCINFO
          echo '  provides = juicebox2-plus' >> .SRCINFO
          echo '  conflicts = juicebox2-plus' >> .SRCINFO
          echo '  source = git+https://github.com/juiceboxdev/juicebox-plus.git' >> .SRCINFO
          echo '  md5sums = SKIP' >> .SRCINFO
          echo 'pkgname = juicebox2-plus-git' >> .SRCINFO

          git init
          git config user.name "JuiceyDev"
          git config user.email "me@juicey.dev"
          git add -A
          git commit -m "aur update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add aur ssh://aur@aur.archlinux.org/juicebox2-plus-git.git
          GIT_SSH_COMMAND="ssh -i /dev/shm/aur-key -o StrictHostKeyChecking=accept-new" git push aur master

  deploy-bin:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write SSH key
        run: |
          mkdir -p /dev/shm
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > /dev/shm/aur-key
          chmod 600 /dev/shm/aur-key

      - name: Publish juicebox2-plus-bin to AUR
        run: |
          version="${GITHUB_REF_NAME#v}"

          cd /tmp
          rm -rf aur-push && mkdir aur-push && cd aur-push

          cp "$GITHUB_WORKSPACE/packaging/linux/arch/PKGBUILD.bin" PKGBUILD
          sed -i "s/^pkgver=0\\.0\\.0/pkgver=$version/" PKGBUILD

          echo 'pkgbase = juicebox2-plus-bin' > .SRCINFO
          echo '  pkgdesc = The companion app for juicebox! (binary release)' >> .SRCINFO
          echo "  pkgver = $version" >> .SRCINFO
          echo '  pkgrel = 1' >> .SRCINFO
          echo '  url = https://github.com/juiceboxdev/juicebox-plus' >> .SRCINFO
          echo '  arch = x86_64' >> .SRCINFO
          echo '  license = LGPL-3.0-or-later' >> .SRCINFO
          echo '  depends = gtk3' >> .SRCINFO
          echo '  depends = libappindicator-gtk3' >> .SRCINFO
          echo '  depends = libdbus' >> .SRCINFO
          echo '  depends = libxdo' >> .SRCINFO
          echo '  depends = glibc' >> .SRCINFO
          echo '  provides = juicebox2-plus' >> .SRCINFO
          echo '  conflicts = juicebox2-plus' >> .SRCINFO
          echo "  source = https://github.com/juiceboxdev/juicebox-plus/releases/download/${GITHUB_REF_NAME}/juicebox-plus-linux" >> .SRCINFO
          echo '  source = https://raw.githubusercontent.com/juiceboxdev/juicebox-plus/main/packaging/linux/juicebox-plus.desktop' >> .SRCINFO
          echo '  source = https://raw.githubusercontent.com/juiceboxdev/juicebox-plus/main/assets/logo.png' >> .SRCINFO
          echo '  source = https://raw.githubusercontent.com/juiceboxdev/juicebox-plus/main/LICENSE' >> .SRCINFO
          echo '  md5sums = SKIP' >> .SRCINFO
          echo '  md5sums = SKIP' >> .SRCINFO
          echo '  md5sums = SKIP' >> .SRCINFO
          echo '  md5sums = SKIP' >> .SRCINFO
          echo 'pkgname = juicebox2-plus-bin' >> .SRCINFO

          git init
          git config user.name "JuiceyDev"
          git config user.email "me@juicey.dev"
          git add -A
          git commit -m "aur update v$version ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git remote add aur ssh://aur@aur.archlinux.org/juicebox2-plus-bin.git
          GIT_SSH_COMMAND="ssh -i /dev/shm/aur-key -o StrictHostKeyChecking=accept-new" git push aur master
