name: AUR

on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  deploy-git:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write SSH key
        run: |
          mkdir -p /dev/shm
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > /dev/shm/aur-key
          chmod 600 /dev/shm/aur-key

      - name: Publish juicebox-plus-git to AUR
        run: |
          cd /tmp
          rm -rf aur-push && mkdir aur-push && cd aur-push

          cp "$GITHUB_WORKSPACE/packaging/linux/arch/PKGBUILD" .

          cat > .SRCINFO << SRCEND
pkgbase = juicebox-plus-git
  pkgdesc = The companion app for juicebox!
  pkgver = r0.0000000
  pkgrel = 1
  url = https://github.com/juiceboxdev/juicebox-plus
  arch = x86_64
  license = LGPL-3.0-or-later
  makedepends = git
  makedepends = cargo
  depends = gtk3
  depends = libappindicator-gtk3
  depends = libdbus
  depends = libxdo
  depends = glibc
  provides = juicebox-plus
  conflicts = juicebox-plus
  source = git+https://github.com/juiceboxdev/juicebox-plus.git
  md5sums = SKIP
pkgname = juicebox-plus-git
SRCEND

          git init
          git config user.name "JuiceyDev"
          git config user.email "me@juicey.dev"
          git add -A
          git commit -m "aur update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add aur ssh://aur@aur.archlinux.org/juicebox-plus-git.git
          GIT_SSH_COMMAND="ssh -i /dev/shm/aur-key -o StrictHostKeyChecking=accept-new" git push aur master

  deploy-bin:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write SSH key
        run: |
          mkdir -p /dev/shm
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > /dev/shm/aur-key
          chmod 600 /dev/shm/aur-key

      - name: Publish juicebox-plus-bin to AUR
        run: |
          version="${GITHUB_REF_NAME#v}"

          cd /tmp
          rm -rf aur-push && mkdir aur-push && cd aur-push

          cat > PKGBUILD << PKGEND
# Maintainer: JuiceyDev <me@juicey.dev>
# Contributor: JuiceyDev <me@juicey.dev>

pkgname=juicebox-plus-bin
pkgver=$version
pkgrel=1
pkgdesc='The companion app for juicebox! (binary release)'
arch=('x86_64')
url='https://github.com/juiceboxdev/juicebox-plus'
license=('LGPL-3.0-or-later')
depends=('gtk3' 'libappindicator-gtk3' 'libdbus' 'libxdo' 'glibc')
provides=('juicebox-plus')
conflicts=('juicebox-plus')
source=(
  "https://github.com/juiceboxdev/juicebox-plus/releases/download/${GITHUB_REF_NAME}/juicebox-plus-linux"
  "https://raw.githubusercontent.com/juiceboxdev/juicebox-plus/main/packaging/linux/juicebox-plus.desktop"
  "https://raw.githubusercontent.com/juiceboxdev/juicebox-plus/main/assets/logo.png"
  "https://raw.githubusercontent.com/juiceboxdev/juicebox-plus/main/LICENSE"
)
md5sums=('SKIP' 'SKIP' 'SKIP' 'SKIP')

package() {
  install -Dm755 "juicebox-plus-linux" "\$pkgdir/usr/bin/juicebox-plus"
  install -Dm644 "juicebox-plus.desktop" "\$pkgdir/usr/share/applications/juicebox-plus.desktop"
  install -Dm644 "logo.png" "\$pkgdir/usr/share/pixmaps/juicebox-plus.png"
  install -Dm644 "LICENSE" "\$pkgdir/usr/share/licenses/\$pkgname/LICENSE"
}
PKGEND

          cat > .SRCINFO << SRCEND
pkgbase = juicebox-plus-bin
  pkgdesc = The companion app for juicebox! (binary release)
  pkgver = $version
  pkgrel = 1
  url = https://github.com/juiceboxdev/juicebox-plus
  arch = x86_64
  license = LGPL-3.0-or-later
  depends = gtk3
  depends = libappindicator-gtk3
  depends = libdbus
  depends = libxdo
  depends = glibc
  provides = juicebox-plus
  conflicts = juicebox-plus
  source = https://github.com/juiceboxdev/juicebox-plus/releases/download/${GITHUB_REF_NAME}/juicebox-plus-linux
  source = https://raw.githubusercontent.com/juiceboxdev/juicebox-plus/main/packaging/linux/juicebox-plus.desktop
  source = https://raw.githubusercontent.com/juiceboxdev/juicebox-plus/main/assets/logo.png
  source = https://raw.githubusercontent.com/juiceboxdev/juicebox-plus/main/LICENSE
  md5sums = SKIP
  md5sums = SKIP
  md5sums = SKIP
  md5sums = SKIP
pkgname = juicebox-plus-bin
SRCEND

          git init
          git config user.name "JuiceyDev"
          git config user.email "me@juicey.dev"
          git add -A
          git commit -m "aur update v$version ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git remote add aur ssh://aur@aur.archlinux.org/juicebox-plus-bin.git
          GIT_SSH_COMMAND="ssh -i /dev/shm/aur-key -o StrictHostKeyChecking=accept-new" git push aur master
