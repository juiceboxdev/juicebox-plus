[package]
name = "juicebox-plus"
version = "1.0.0"
edition = "2021"
license = "LGPL-3.0-or-later"
authors = ["JuiceyDev"]
description = "System tray application for the Juicepipe high-throughput file ingest daemon"
repository = "https://github.com/juiceboxdev/juicebox-plus"

[dependencies]
juicepipe = { path = "juicepipe/crates/juicepipe" }
tao = "0.34"
tray-icon = "0.19"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "fs"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
serde_json = "1"
image = "0.25"
dirs = "6"
reqwest = { version = "0.12", features = ["json", "stream"] }
bytes = "1"
http = "1"
gethostname = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
tinyfiledialogs = "3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"
zbus = "5"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Foundation",
    "Foundation_Collections",
] }

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"

[package.metadata.deb]
maintainer = "JuiceyDev"
copyright = "2024 JuiceyDev"
depends = "libgtk-3-0, libappindicator3-1, libdbus-1-3"
section = "utils"
priority = "optional"

[package.metadata.rpm]
name = "juicebox-plus"
summary = "System tray application for the Juicepipe high-throughput file ingest daemon"
group = "Applications/Utilities"
license = "LGPL-3.0-or-later"
url = "https://github.com/juiceboxdev/juicebox-plus"

[build-dependencies]
winresource = { version = "0.1" }

[features]
default = []
